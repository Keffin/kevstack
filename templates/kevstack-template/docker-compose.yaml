name: kevstack-template

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    container_name: kevstack_template_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kevstack_template
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kevstack_template"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
