name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: packages/create-kevstack
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Pin an npm version known to support `npm stage`, rather than whatever Node bundles
      - run: npm install -g npm@11.17.0
      - run: pnpm install --frozen-lockfile
      - name: Check the release tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: pnpm test
      - run: pnpm build
      # Staged versions only go live once approved with 2FA: `npm stage approve <stage-id>`
      - run: npm stage publish . --access public
